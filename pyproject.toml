[project]
name = "mini-crawler"
version = "0.1.0"
description = "A policy-first asynchronous crawler and approved-media downloader."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.5,<3",
    "structlog>=25.1,<26",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "celery>=5.3,<6",
    "boto3>=1.34,<2",
    "httpx>=0.28,<1",
    "selectolax>=0.3,<1",
    "markdownify>=0.11,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
    "respx>=0.21,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs"]

[build-system]
requires = ["uv_build>=0.7,<0.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run pytest

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

  cleanup:
    needs: quality
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Delete GitHub Actions caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete --all --succeed-on-no-caches --repo "$GITHUB_REPOSITORY"
